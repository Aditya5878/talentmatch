services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({\"ping\": 1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/talentmatch
      QDRANT_URL: http://qdrant:6333
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./src:/app/src

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "7860:7860"
    environment:
      API_BASE: http://api:8000
    depends_on:
      api:
        condition: service_started

volumes:
  mongo_data:
  qdrant_data:
